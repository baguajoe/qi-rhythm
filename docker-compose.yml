services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qi
      POSTGRES_PASSWORD: qi
      POSTGRES_DB: qi_rhythm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qi"]
      interval: 3s
      retries: 10

volumes:
  pgdata:
